<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DDF3EC">
<title>tekuteku kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one centered play card per screen, big tap targets, buddy always present at the top */
:root{
  --ground:#DDF3EC; --ground2:#C3EADF; --card:#FFFFFF; --ink:#1E2A4A; --soft:#5B6788;
  --tang:#FF8A3D; --berry:#E8457A; --sky:#3BA3E8; --sun:#FFC83D; --leaf:#3DBE7A;
  --display:"Baloo 2","M PLUS Rounded 1c",ui-rounded,system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Baloo 2",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
body::after{content:"";position:fixed;inset:auto 0 0 0;height:22vh;background:var(--ground2);border-radius:60% 60% 0 0/40% 40% 0 0;z-index:-1}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:14px 24px;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.01em}
.brand b{color:var(--tang)}
.brand .kids{font-size:.8rem;font-weight:800;color:#fff;background:var(--leaf);padding:2px 8px;border-radius:999px;vertical-align:middle;letter-spacing:.04em}
.lang{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:0 2px 0 var(--ground2)}
.lang button{border:0;background:transparent;font:700 .9rem var(--body);color:var(--soft);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stars{font-family:var(--display);font-weight:800;color:var(--ink);display:flex;align-items:center;gap:4px;background:var(--sun);padding:4px 12px;border-radius:999px}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}
.bubble-row{display:flex;align-items:flex-end;gap:10px}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:14px 18px;font-weight:700;font-size:1.15rem;line-height:1.45;box-shadow:0 3px 0 var(--ground2);flex:1;min-width:0}
.panel{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 4px 0 var(--ground2);display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:1.5rem;margin:0;text-wrap:balance}
.big-btn{border:0;cursor:pointer;font:800 1.25rem var(--display);color:#fff;background:var(--tang);padding:16px 22px;border-radius:20px;box-shadow:0 5px 0 #D9661F;transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D9661F}
.big-btn:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
input#kidname{font:700 1.3rem var(--body);border:3px solid var(--ground2);border-radius:16px;padding:12px 14px;color:var(--ink);background:#fff;width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ground2);background:#fff;color:var(--ink);font:800 1.3rem var(--display);width:58px;height:58px;border-radius:50%;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.label{font-weight:700;color:var(--soft);font-size:.95rem;letter-spacing:.03em}
.buddies{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.buddy{border:4px solid transparent;background:var(--ground);border-radius:24px;padding:12px 8px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 1.1rem var(--display);color:var(--ink)}
.buddy[aria-pressed="true"]{border-color:var(--tang);background:#FFF1E6}
.buddy svg{width:92px;height:92px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game{border:0;cursor:pointer;border-radius:28px;padding:18px 12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);transition:transform .08s}
.game:active{transform:scale(.97)}
.game .glyph{font-size:3rem;font-weight:800;line-height:1}
.game .gname{font-weight:800;font-size:1.15rem}
.g-abc{background:var(--berry);box-shadow:0 6px 0 #B92E5C}
.g-num{background:var(--sky);box-shadow:0 6px 0 #2479B5}
.g-ani{background:var(--leaf);box-shadow:0 6px 0 #2A9460;grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px}
.ani-row{display:flex}.g-ani{padding:26px 12px;flex-direction:column}.g-ani .gname{font-size:1.6rem}
.ani-row img{width:80px;height:80px;margin-left:-10px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.ani-word{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,12vw,4rem);text-align:center;color:var(--leaf);line-height:1.2}
.choice.ani-choice{padding:8px;display:flex;align-items:center;justify-content:center}.choice.ani-choice{background:#fff}.choice.ani-choice img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.vsel{font:700 1rem var(--body);padding:12px;border-radius:14px;border:3px solid var(--ground2);background:#fff;color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--tang);height:32px}
.tower-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--card);border-radius:24px;padding:10px 14px 0;box-shadow:0 4px 0 var(--ground2);overflow:hidden}
.tower-count{font-family:var(--display);font-weight:800;color:var(--soft);padding-bottom:10px;min-width:56px;line-height:1}
.tower-count b{font-size:2rem;color:var(--tang);display:block}
.tower{position:relative;flex:1;height:202px;border-bottom:6px solid #A8D8C8}
.stack{position:absolute;inset:0;transform-origin:50% 100%;animation:sway var(--dur,3s) ease-in-out infinite alternate}
.tower.falling .stack,.tower.done .stack{animation:none}
@keyframes sway{from{transform:rotate(calc(var(--amp,.5deg)*-1))}to{transform:rotate(var(--amp,.5deg))}}
.goal-line{position:absolute;left:0;right:0;bottom:180px;border-top:2px dashed var(--berry);opacity:.7}
.goal-line span{position:absolute;right:0;top:-16px;font:800 .7rem var(--display);color:var(--berry);letter-spacing:.08em}
.blk{position:absolute;left:50%;height:9px;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.blk.drop{animation:drop .45s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.blk.fall{animation:fallblk 1s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes fallblk{to{transform:translate(var(--fx),260px) rotate(var(--fr));opacity:0}}
.goal-big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--tang);line-height:1}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,230,120,.55));pointer-events:none;z-index:30;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.6}to{opacity:0}}
body.shake .wrap{animation:bshake .5s}
@keyframes bshake{15%{transform:translate(-8px,3px) rotate(-1deg)}35%{transform:translate(8px,-3px) rotate(1deg)}55%{transform:translate(-6px,2px)}75%{transform:translate(4px,-1px)}}
.pt{position:fixed;border-radius:50%;pointer-events:none;z-index:31;transform:translate(-50%,-50%);animation:pt .85s cubic-bezier(.15,.8,.3,1) forwards}
.pt.star{border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes pt{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2) rotate(240deg);opacity:0}}
.poptxt{position:fixed;left:50%;top:24%;z-index:32;pointer-events:none;font:800 3.4rem var(--display);color:#FFC83D;-webkit-text-stroke:2px #E08A20;text-shadow:0 4px 0 rgba(0,0,0,.12);transform:translate(-50%,-50%);animation:popt 1s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.poptxt.big{font-size:clamp(1.5rem,7vw,2.2rem);color:#fff;-webkit-text-stroke:0;background:var(--berry);padding:12px 24px;border-radius:28px;white-space:normal;width:max-content;max-width:86vw;text-align:center;line-height:1.3;box-shadow:0 6px 0 #B92E5C;animation-duration:1.5s}
[hidden]{display:none!important}
@keyframes popt{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}60%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-110%) scale(.95);opacity:0}}
.choice{position:relative;overflow:visible}
.choice.right{animation:rightpop .55s cubic-bezier(.2,1.8,.4,1);z-index:2}
@keyframes rightpop{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-4deg)}65%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1.15)}}
.choice.right.ani-choice{background:#FFF6D6;box-shadow:0 0 0 5px var(--sun),0 5px 0 #E0A11A}
.rays{position:absolute;inset:-40%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,61,.75) 0 12deg,transparent 12deg 30deg);animation:rays 1.6s linear forwards;pointer-events:none}
@keyframes rays{from{transform:rotate(0) scale(.3);opacity:1}to{transform:rotate(200deg) scale(1.3);opacity:0}}
#t-n.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.8);color:var(--berry)}}
.hero{position:fixed;z-index:33;pointer-events:none;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25));animation:hero 1.25s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes hero{0%{transform:none}35%{transform:translate(var(--tx),var(--ty)) scale(2.2) rotate(-6deg)}55%{transform:translate(var(--tx),calc(var(--ty) - 14px)) scale(2.3) rotate(5deg)}75%{transform:translate(var(--tx),var(--ty)) scale(2.2) rotate(0)}100%{transform:translate(var(--tx),calc(var(--ty) - 40px)) scale(1.6);opacity:0}}
.megarays{position:fixed;left:50%;top:42%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;z-index:29;pointer-events:none;border-radius:50%;
 background:repeating-conic-gradient(rgba(255,90,90,.35) 0 8deg,transparent 8deg 15deg,rgba(255,200,61,.4) 15deg 23deg,transparent 23deg 30deg,rgba(59,163,232,.35) 30deg 38deg,transparent 38deg 45deg,rgba(61,190,122,.35) 45deg 53deg,transparent 53deg 60deg);
 -webkit-mask:radial-gradient(circle,transparent 4%,#000 12%,#000 40%,transparent 60%);mask:radial-gradient(circle,transparent 4%,#000 12%,#000 40%,transparent 60%);animation:megarays 1.2s ease-out forwards}
@keyframes megarays{from{transform:rotate(0) scale(.2);opacity:1}to{transform:rotate(120deg) scale(1);opacity:0}}
.flystar{position:fixed;z-index:34;pointer-events:none;color:#FFC83D;font-size:26px;-webkit-text-stroke:1.5px #E08A20;transform:translate(-50%,-50%);animation:flystar .9s cubic-bezier(.5,-0.4,.7,1) forwards}
@keyframes flystar{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5) rotate(360deg)}}
#stars.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
.wrap.punch{animation:punch .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes punch{40%{transform:scale(1.035)}}
.mascot.superjump{animation:superjump .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes superjump{35%{transform:translateY(-22px) scale(1.08)}65%{transform:translateY(-6px)}100%{transform:none}}
.poptxt.combo{background:linear-gradient(90deg,#FF5A5A,#FFC83D,#3DBE7A,#3BA3E8,#9B6BE8,#FF5A5A);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #fff;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));animation:popt 1s cubic-bezier(.2,1.6,.4,1) forwards,rainbow .6s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
body.fever{background:linear-gradient(120deg,#E6F6EE,#FFF6DC,#DDF3EC,#E4F1FB,#DDF3EC);background-size:400% 400%;animation:fever 8s linear infinite}
@keyframes fever{to{background-position:400% 0}}
.brand{white-space:nowrap;font-size:clamp(1.02rem,4.5vw,1.35rem)!important}.brand .kids{font-size:.7rem!important}
.lang button{white-space:nowrap;padding:6px 9px!important}.stars{padding:4px 9px!important;white-space:nowrap}
.top>div{gap:6px!important}
.bgm-btn{border:0;cursor:pointer;width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--tang);font:800 1.2rem var(--display);box-shadow:0 2px 0 var(--ground2);flex:none}
.bgm-btn.off{color:var(--soft);opacity:.55;text-decoration:line-through}
.ani-count{font-size:.85rem;color:var(--soft);text-align:center;font-weight:700}
.target{font-family:var(--display);font-weight:800;font-size:clamp(5rem,26vw,8rem);line-height:1;text-align:center;color:var(--berry)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{border:0;cursor:pointer;background:var(--ground);color:var(--ink);font:800 clamp(2.2rem,11vw,3.2rem) var(--display);border-radius:22px;aspect-ratio:1;max-width:100%;box-shadow:0 5px 0 var(--ground2);transition:transform .1s}
.choice:active{transform:translateY(3px)}
.choice.right{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #2A9460}
.choice.wrong{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.field{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:120px;align-content:center;padding:8px}
.apple{width:44px;height:48px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ghost{border:0;background:transparent;font:700 1rem var(--body);color:var(--soft);cursor:pointer;padding:8px 4px}
.speak{border:0;background:var(--ground);border-radius:999px;padding:8px 14px;font:700 1rem var(--body);color:var(--ink);cursor:pointer}
.mascot{width:84px;height:84px;flex:none}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.cheer{animation:cheer .6s ease}
@keyframes cheer{30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(1.1) rotate(5deg)}}
.grown{font-size:.85rem;color:var(--soft);line-height:1.5;text-align:center;margin:0}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ground2)}
.dots i.on{background:var(--tang)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti span{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.hero,.megarays,.flystar,body.fever,.mascot.superjump,.wrap.punch,.flash,.rays,body.shake .wrap,.stack,.blk.drop,.bob,.cheer,.choice.wrong{animation:none}.confetti{display:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">teku<b>teku</b> <span class="kids">kids</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="bgm-btn" id="bgm-btn" aria-label="BGM" aria-pressed="true">♪</button>
      <div class="stars" id="stars" hidden>★ <span id="starN">0</span></div>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-en" data-l="en">EN</button>
        <button id="lang-ja" data-l="ja">日本語</button>
      </div>
    </div>
  </div>
  <main class="screen" id="app"></main>
</div>
<div class="confetti" id="confetti"></div>

 for(const n of VOICE_PREF[lang]){const v=mine.find(x=>x.name.includes(n));if(v)return v}
 return mine.find(v=>/natural|neural|premium|enhanced|拡張/i.test(v.name))||mine.find(v=>v.lang.replace("_","-")===(lang==="ja"?"ja-JP":"en-US"))||mine[0]||null}catch(e){return null}}

 el.innerHTML=`<div class="goal-line"><span>GOAL</span></div><div class="stack">`+BLK.slice(0,n).map((b,i)=>`<i class="blk${drop&&i===n-1?" drop":""}" style="bottom:${i*9}px;width:${b.w}px;margin-left:${-b.w/2+b.dx}px;background:${b.c}"></i>`).join("")+`</div>`;
 el.style.setProperty("--amp",(0.4+n*0.22)+"deg");el.style.setProperty("--dur",(3.2-n*0.06)+"s");

let AC=null;function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}

function tone(f,t0,d,type="sine",vol=.22,slide=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);
 if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,a.currentTime+t0+d);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.01);
 g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
function noise(t0,d,vol=.3,hp=200){const a=ac();if(!a)return;const len=a.sampleRate*d,buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
 const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;src.connect(f).connect(g).connect(a.destination);src.start(a.currentTime+t0)}
function sfxCorrect(n){const base=523.25*Math.pow(2,Math.min(n-1,19)/24);[0,4,7,12].forEach((st,i)=>tone(base*Math.pow(2,st/12),i*.07,.35,"triangle",.2));tone(base*4,.28,.5,"sine",.08);
 setTimeout(()=>{noise(0,.12,.5,180);tone(110,0,.15,"sine",.35,.5)},420)}
function sfxBig(){[0,4,7,12,16,19,24].forEach((st,i)=>tone(523.25*Math.pow(2,st/12),.5+i*.06,.4,"square",.07))}
function sfxCrash(){noise(0,.9,.55,900);[0,.12,.24,.36,.5].forEach((t,i)=>tone(220-i*30,t,.18,"triangle",.18,.6))}
function sfxBoo(){tone(300,0,.25,"sawtooth",.08,.7)}
function sfxFanfare(){const n=[523.25,659.25,783.99,1046.5];n.forEach((f,i)=>tone(f,i*.13,.3,"square",.1));[523.25,659.25,783.99,1046.5].forEach(f=>tone(f,.6,1.2,"triangle",.12));noise(.6,.4,.15,4000)}
function flash(){const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),450)}
function shake(){document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake")}
function particles(el,count=26){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const cols=["#FFC83D","#FF8A3D","#E8457A","#3BA3E8","#3DBE7A","#fff"];
 for(let i=0;i<count;i++){const p=document.createElement("span");p.className="pt"+(i%3===0?" star":"");const ang=Math.random()*Math.PI*2,dist=70+Math.random()*130;
  p.style.left=cx+"px";p.style.top=cy+"px";p.style.setProperty("--x",Math.cos(ang)*dist+"px");p.style.setProperty("--y",Math.sin(ang)*dist+"px");p.style.background=cols[i%6];
  const sz=8+rand(10);p.style.width=p.style.height=sz+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),900)}}
function popText(txt,big,n=1){const p=document.createElement("div");p.className="poptxt"+(big?" big":"")+(n>=2&&!big?" combo":"");if(!big)p.style.fontSize="min("+Math.min(2.2+n*0.05,2.8)+"rem,10vw)";p.textContent=txt;document.body.appendChild(p);setTimeout(()=>p.remove(),big?1500:1000)}
function heroAnimal(btn){const img=btn.querySelector("img");if(!img)return;const r=img.getBoundingClientRect();const h=document.createElement("img");h.src=img.src;h.className="hero";
 h.style.left=r.left+"px";h.style.top=r.top+"px";h.style.width=r.width+"px";h.style.height=r.height+"px";
 h.style.setProperty("--tx",(innerWidth/2-r.left-r.width/2)+"px");h.style.setProperty("--ty",(innerHeight*0.42-r.top-r.height/2)+"px");
 document.body.appendChild(h);setTimeout(()=>h.remove(),1300)}
function megaRays(){const d=document.createElement("div");d.className="megarays";document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function fireworks(k=3){for(let i=0;i<k;i++)setTimeout(()=>{const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.12+Math.random()*.35);
 const fake={getBoundingClientRect:()=>({left:x,top:y,width:0,height:0})};particles(fake,34);tone(900+rand(600),0,.25,"sine",.08,2)},i*220)}
function starsToCounter(btn,k=6){const t=document.getElementById("stars");if(!t)return;const a=btn.getBoundingClientRect(),b=t.getBoundingClientRect();
 for(let i=0;i<k;i++){const s=document.createElement("span");s.className="flystar";s.textContent="★";s.style.left=(a.left+a.width/2)+"px";s.style.top=(a.top+a.height/2)+"px";
  s.style.setProperty("--dx",(b.left+b.width/2-a.left-a.width/2+(Math.random()*40-20))+"px");s.style.setProperty("--dy",(b.top+b.height/2-a.top-a.height/2)+"px");
  s.style.animationDelay=(i*.06)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
 setTimeout(()=>{t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump")},800)}
function punch(){const w=document.querySelector(".wrap");w.classList.remove("punch");void w.offsetWidth;w.classList.add("punch")}
function setFever(on){document.body.classList.toggle("fever",!!on)}
function dopa(btn,n){sfxCorrect(n);particles(btn,24);heroAnimal(btn);starsToCounter(btn,3);setFever(n>=GOAL/2);
 const bm=app.querySelector(".mascot");if(bm){bm.classList.remove("superjump");void bm.getBoundingClientRect();bm.classList.add("superjump")}
 const rays=document.createElement("span");rays.className="rays";btn.appendChild(rays);
 const ms=n%5===0&&n<GOAL;popText(ms?t().streak(n):(n>=2?"COMBO ×"+n:"+1"),ms,n);
 if(ms){sfxBig();flash();megaRays();fireworks(3);setTimeout(burst,150)}
 const c=document.getElementById("t-n");if(c){c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
 try{navigator.vibrate&&navigator.vibrate(ms?[30,40,60]:25)}catch(e){}}

function addStar(){S.stars++;store.set("stars",S.stars);$("#starN").textContent=S.stars;
 const c=$("#confetti");const cols=["#FF8A3D","#E8457A","#3BA3E8","#FFC83D","#3DBE7A"];
 for(let i=0;i<24;i++){const s=document.createElement("span");s.style.left=rand(100)+"vw";s.style.background=cols[i%5];s.style.animationDelay=(Math.random()*.3)+"s";c.appendChild(s);setTimeout(()=>s.remove(),1900)}}

const DECKS={};
function draw(name,pool){const sig=pool.join("|");let d=DECKS[name];
 if(!d||d.sig!==sig||!d.left.length){const last=d&&d.last;const left=shuffle(pool.slice());if(left.length>1&&left[left.length-1]===last){left.unshift(left.pop())}d=DECKS[name]={sig,left,last}}
 const v=d.left.pop();d.last=v;return v}
function pickOthers(pool,ans,n){return shuffle(pool.filter(x=>x!==ans)).slice(0,n)}
function quiz({title,stage,prompt,answer,options,onDone,render=o=>o,cls="",extra=null}){
 app.innerHTML=`<div class="row"><button class="ghost" id="b-home">${t().home}</button><button class="speak" id="b-say">${t().hear}</button></div>
 <div class="bubble-row">${buddySVG(S.buddy,"mascot")}<div class="bubble" id="msg">${title}</div></div>
 <div class="panel">${stage}<div class="choices">${options.map(o=>`<button class="choice ${cls}" data-v="${o}" aria-label="${o}">${render(o)}</button>`).join("")}</div></div>
 <div class="tower-wrap"><div class="tower-count"><b id="t-n">${TOWER.n}</b><span>/ ${GOAL}</span></div><div class="tower" id="tower"></div></div>`;
 renderTower(false);
 $("#b-home").onclick=()=>go(home);$("#b-say").onclick=()=>say(prompt);say(prompt);
 let done=false;
 app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(done)return;
  if(b.dataset.v===String(answer)){done=true;b.classList.add("right");const ex=extra?extra(answer):"";const g=t().great[rand(4)]+(ex?" "+ex:"");$("#msg").textContent=g;addStar();
   TOWER.n++;const tw=document.getElementById("tower");if(tw)tw.classList.remove("falling");renderTower(true);
   dopa(b,TOWER.n);setTimeout(()=>say(g),380);
   const m=app.querySelector(".mascot");m.classList.add("cheer");setTimeout(TOWER.n>=GOAL?()=>go(goalScreen):onDone,ex?2600:1500)}
  else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");const fell=TOWER.n>0;const msg=fell?t().fell:t().tryAgain;$("#msg").textContent=msg;say(msg);if(fell){sfxCrash();shake();setFever(false);collapseTower()}else sfxBoo()}})}

function letters(){
 const pool=S.lang==="ja"?(S.age<=3?KANA.slice(0,10):KANA):(S.age<=3?ABC.slice(0,10):ABC);
 const ans=draw("letters"+S.lang,pool);const opts=[ans,...pickOthers(pool,ans,2)];
 quiz({title:t().find(ans),prompt:t().find(ans),stage:`<div class="target">${ans}</div>`,answer:ans,options:shuffle([...opts]),onDone:()=>go(letters)})}

function numbers(){
 const max=S.age<=3?5:10;const nums=Array.from({length:max},(_,i)=>i+1);const ans=draw("numbers",nums);const opts=new Set([ans,...pickOthers(nums,ans,2)]);
 quiz({title:t().how,prompt:t().how,stage:`<div class="field">${APPLE.repeat(ans)}</div>`,answer:ans,options:shuffle([...opts]).sort((a,b)=>a-b),onDone:()=>go(numbers)})}

function animals(){
 const pool=ANI_KEYS;
 const ans=draw("animals",pool);const opts=[ans,...pickOthers(pool,ans,2)];
 const name=t().ani[ans];
 quiz({title:t().findAni(name),prompt:t().findAni(name),stage:`<div class="ani-word">${name}</div>`,answer:ans,options:shuffle([...opts]),cls:"ani-choice",render:k=>`<img src="${ANI_IMG[k]}" alt="">`,extra:k=>(t().cry[k]||""),onDone:()=>go(animals)})}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;store.set("lang",S.lang);go(current)});
bgmButton();
go(S.buddy?home:stepHello);
</script>
